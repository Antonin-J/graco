[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graco"
version = "0.1.0"
description = "A unified toolkit of graph coarsening methods"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "licenses/Apache-2.0.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Antonin Joly" }]
keywords = [
    "graph coarsening",
    "graph reduction",
    "graph neural networks",
    "spectral graph theory",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.7",
    "torch-geometric>=2.7",
    "numpy>=2.3",
    "scipy>=1.16",
    "scikit-learn>=1.8",
    "networkx>=3.6",
    "numba>=0.63",
    "pymetis>=2025.2",
    "tqdm>=4.67",
]

[project.urls]
Homepage = "https://github.com/Antonin-J/graco"
Author = "https://antonin-j.github.io"

[project.optional-dependencies]
ogb = ["ogb>=1.3.6"]
graclus = ["torch-cluster>=1.6.3"]
# Installing this extra pulls igraph (GPL-2.0) and leidenalg (GPL-3.0),
# neither of which is a dependency of graco itself. See THIRD_PARTY_NOTICES.md.
leiden = ["igraph>=1.0", "leidenalg>=0.11"]
# reproduce/sbm_viz.py, ipe_k_effect.py and rgg_viz.py only. The library itself
# draws nothing.
viz = ["matplotlib>=3.10"]

# This directory is both the repository root and the package. setuptools cannot
# guess that, so the mapping is spelled out.
[tool.setuptools]
package-dir = { "graco" = "." }
packages = [
    "graco",
    "graco.algorithms",
    "graco.algorithms.local_variation",
    "graco.core",
    "graco.loaders",
    "graco.metrics",
    "graco.refinement",
    "graco.reproduce",
]
